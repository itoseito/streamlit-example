<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:N;font-weight:500;src:url(../fonts/noto-sans-jp-japanese-500-normal.woff2) format("woff2")}
@font-face{font-family:NL;font-weight:500;src:url(../fonts/noto-sans-jp-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:N;font-weight:700;src:url(../fonts/noto-sans-jp-japanese-700-normal.woff2) format("woff2")}
@font-face{font-family:NL;font-weight:700;src:url(../fonts/noto-sans-jp-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:N;font-weight:900;src:url(../fonts/noto-sans-jp-japanese-900-normal.woff2) format("woff2")}
@font-face{font-family:NL;font-weight:900;src:url(../fonts/noto-sans-jp-latin-900-normal.woff2) format("woff2")}
:root{--navy:#0b1820;--panel:#16262f;--mint:#5fd6c3;--orange:#f39a4a;--ink:#f3f7f8;--dim:#8ea3ad}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:NL,N,sans-serif;color:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;background:radial-gradient(circle at 50% 46%,#12303a 0,#0b1820 46%)}
#brand{position:absolute;left:70px;top:176px;font-weight:900;font-size:38px;color:var(--mint);letter-spacing:1px}
#brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--orange);margin-left:18px;vertical-align:14px}
#tag{position:absolute;left:70px;top:232px;font-size:26px;color:var(--dim);font-weight:500}
#head{position:absolute;left:0;right:0;top:330px;text-align:center;font-weight:900;font-size:74px;letter-spacing:1px}
#art{position:absolute;left:0;top:470px;width:1080px;height:900px}
#cap{position:absolute;left:70px;right:70px;top:1400px;height:132px;border-radius:22px;background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:50px}
#note{position:absolute;left:0;right:0;top:1562px;text-align:center;font-size:24px;color:var(--dim);font-weight:500}
#bar{position:absolute;left:70px;right:70px;top:1616px;height:5px;background:#22363f;border-radius:3px}
#bar b{display:block;height:100%;background:var(--mint);border-radius:3px}
svg text{font-family:NL,N,sans-serif;font-weight:700}
</style></head><body>
<div id="stage">
  <div id="brand">TRY LOG<i></i></div><div id="tag"></div>
  <div id="head"></div>
  <svg id="art" viewBox="0 0 540 450"></svg>
  <div id="cap"></div><div id="note"></div><div id="bar"><b></b></div>
</div>
<script src="build/data.js"></script>
<script>
const D = window.DATA, $ = id => document.getElementById(id);
const MINT = "#5fd6c3", ORANGE = "#f39a4a", INK = "#f3f7f8", WALL = "#9cc9cf", TEA = "#6e3d2b", ICE = "#27507f";
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = cl(x); return x * x * (3 - 2 * x); };
const seg = (t, start, len) => ease((t - start) / len);          // start から len 秒かけて 0→1
const lerp = (a, b, k) => a + (b - a) * k;
const mix = (c1, c2, k) => { const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const a = p(c1), b = p(c2); return "#" + a.map((v, i) => Math.round(lerp(v, b[i], k)).toString(16).padStart(2, "0")).join(""); };
$("tag").textContent = D.tag; $("note").textContent = D.note;

// ---- 部品 ----
const txt = (x, y, s, o = 1, fill = INK, size = 18, anchor = "middle") =>
  `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" opacity="${o}" text-anchor="${anchor}">${s}</text>`;
const arrow = (x1, y1, x2, y2, o = 1, col = ORANGE, w = 3.2) => {
  const a = Math.atan2(y2 - y1, x2 - x1), h = 7;
  return `<g opacity="${o}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none">
  <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>
  <path d="M${x2 - h * Math.cos(a - .5)} ${y2 - h * Math.sin(a - .5)} L${x2} ${y2} L${x2 - h * Math.cos(a + .5)} ${y2 - h * Math.sin(a + .5)}"/></g>`; };
const liquid = (col, top = 150) => `<path d="M226 ${top} q24 -6 44 0 t44 0 V366 q0 12 -12 12 H238 q-12 0 -12 -12 Z" fill="${col}"/>`;
// 断面：外側のびん(200-340)、内側のびん(220-320)、すき間は各20
function section({ liq = TEA, inner = WALL, outer = WALL, innerW = 4, outerW = 5, gap = "none", gapO = 0, lid = "#4b5c68" } = {}) {
  return `<rect x="208" y="28" width="124" height="36" rx="7" fill="${lid}"/>
  <rect x="200" y="60" width="140" height="344" rx="20" fill="#0d1c24" stroke="${outer}" stroke-width="${outerW}"/>
  <rect x="204" y="64" width="132" height="336" rx="17" fill="${gap}" opacity="${gapO}"/>
  <rect x="222" y="80" width="96" height="304" rx="13" fill="#0f2028" stroke="${inner}" stroke-width="${innerW}"/>
  ${liquid(liq)}`; }
const outside = (o = 1) => `<g opacity="${o}"><ellipse cx="270" cy="418" rx="86" ry="9" fill="#060d12"/>
  <rect x="208" y="28" width="124" height="38" rx="8" fill="#55656f"/>
  <rect x="200" y="62" width="140" height="344" rx="22" fill="#3f5c68"/>
  <rect x="222" y="86" width="96" height="296" rx="12" fill="#4a6975"/>
  <rect x="214" y="110" width="5" height="240" rx="2.5" fill="#7fb0b5"/>
  <text x="270" y="232" font-size="12" fill="${MINT}" text-anchor="middle">VACUUM</text>
  <text x="270" y="248" font-size="8" fill="#cfe3e6" text-anchor="middle">INSULATED</text></g>`;
const steam = (t, o) => [248, 270, 292].map((x, i) => { const p = ((t * .45 + i * .33) % 1), y = 20 - p * 46;
  return `<path d="M${x} ${y + 18} q7 -9 0 -18 t0 -18" stroke="#dfeef0" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="${o * Math.sin(p * Math.PI) * .75}"/>`; }).join("");
const glow = (x, y, w, h, o, col = ORANGE, r = 12) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${col}" opacity="${o}"/>`;
const YS = [180, 235, 290, 345];

// ---- 場面ごとの絵（lt=場面内の秒, c=合図の秒, d=場面の長さ）----
const ART = {
  hook(lt, c) { const k = seg(lt, c.evening - .2, .7);
    return outside() + steam(lt, 1) + txt(270, 444, k < .5 ? "朝 7:00" : "夕方 5:00", Math.abs(k - .5) * 2, k < .5 ? INK : ORANGE, 22); },
  cup(lt, c) { const k = seg(lt, c.out, 1.4), w = seg(lt, c.wall - .2, .5);
    let s = `<path d="M200 96 V384 q0 20 20 20 H320 q20 0 20 -20 V96" fill="#0f2028" stroke="${mix(WALL, ORANGE, w * .7)}" stroke-width="7" stroke-linejoin="round"/>
      <path d="M206 150 q32 -7 64 0 t64 0 V382 q0 16 -16 16 H222 q-16 0 -16 -16 Z" fill="${mix(TEA, "#4a3a38", k * .8)}"/>`;
    YS.forEach((y, i) => { const p = ((lt * .55 + i * .23) % 1), on = cl(lt / .6);
      s += arrow(318 + p * 16, y, 352 + p * 62, y, on * Math.sin(p * Math.PI)) + arrow(222 - p * 16, y, 188 - p * 62, y, on * Math.sin(p * Math.PI)); });
    return s + steam(lt, 1 - k * .7) + txt(270, 444, "壁を伝わって、外へ", w, ORANGE, 20); },
  double(lt, c) { const a = seg(lt, c.inner - .15, .35), b = seg(lt, c.outer - .15, .35), pa = a * (1 - b * .6);
    return section({ inner: mix(WALL, MINT, pa), innerW: 4 + pa * 3, outer: mix(WALL, ORANGE, b), outerW: 5 + b * 3 })
      + `<line x1="322" y1="130" x2="372" y2="130" stroke="${MINT}" stroke-width="2" opacity="${a}"/>` + txt(378, 136, "内側のびん", a, MINT, 19, "start")
      + `<line x1="198" y1="250" x2="150" y2="250" stroke="${ORANGE}" stroke-width="2" opacity="${b}"/>` + txt(144, 256, "外側のびん", b, ORANGE, 19, "end"); },
  vacuum(lt, c) { const k = seg(lt, c.pull, 1.3), n = seg(lt, c.name - .2, .5);
    let s = section({ gap: "#123e44", gapO: k * .9 });
    for (let i = 0; i < 22; i++) { const side = i % 2, x = (side ? 329 : 211) + Math.sin(i * 7.3 + lt * 2) * 3.5,
      y0 = 96 + (i >> 1) * 27, y = y0 - k * (y0 - 30) * 1.25 + Math.sin(lt * 3 + i) * 3;
      s += `<circle cx="${x}" cy="${y}" r="3.4" fill="#cfe9ec" opacity="${cl(1 - k * 1.15) * .95}"/>`; }
    s += `<line x1="198" y1="230" x2="150" y2="230" stroke="${MINT}" stroke-width="2"/>`
      + txt(144, 228, "空気", (1 - n), INK, 19, "end") + txt(144, 228, "真空", n, MINT, 24, "end") + txt(144, 252, "空気がほぼ無い", n, "#cfe3e6", 14, "end");
    return s; },
  stop(lt, c) { const g = seg(lt, c.gap - .2, .5), st = seg(lt, c.stop - .1, .3), flash = Math.max(0, 1 - Math.abs(lt - c.stop - .15) / .45);
    let s = section({ gap: MINT, gapO: g * .22 + flash * .35 });
    YS.forEach((y, i) => { const p = ((lt * .7 + i * .21) % 1), e = ease(p);
      s += arrow(286, y, 286 + e * 30, y, Math.sin(p * Math.PI) * .95) + arrow(254, y, 254 - e * 30, y, Math.sin(p * Math.PI) * .95)
        + `<line x1="325" y1="${y - 9}" x2="325" y2="${y + 9}" stroke="${ORANGE}" stroke-width="4" stroke-linecap="round" opacity="${st}"/>`
        + `<line x1="215" y1="${y - 9}" x2="215" y2="${y + 9}" stroke="${ORANGE}" stroke-width="4" stroke-linecap="round" opacity="${st}"/>`; });
    return s + `<line x1="342" y1="262" x2="378" y2="262" stroke="${MINT}" stroke-width="2" opacity="${g}"/>` + txt(384, 260, "すき間", g, MINT, 20, "start")
      + txt(384, 284, "ここで止まる", st, ORANGE, 17, "start"); },
  mirror(lt, c) { const sh = seg(lt, c.shine - .15, .4), sweep = cl((lt - c.shine) / .9), b = seg(lt, c.bounce - .3, .4);
    let s = section({ gap: "#123e44", gapO: .8, inner: mix(WALL, "#ffffff", sh), innerW: 4 + sh * 2 });
    s += `<rect x="317" y="${90 + sweep * 250}" width="6" height="36" rx="3" fill="#fff" opacity="${sh * Math.sin(sweep * Math.PI)}"/>
          <rect x="217" y="${90 + sweep * 250}" width="6" height="36" rx="3" fill="#fff" opacity="${sh * Math.sin(sweep * Math.PI)}"/>`;
    YS.forEach((y, i) => { const p = ((lt * .6 + i * .27) % 1), out = cl(p * 2), back = cl(p * 2 - 1), on = cl(lt / .5);
      const x = 270 + (out - back * b) * 40, yy = y + Math.sin(p * 18) * 5 - back * 14;
      s += `<circle cx="${x}" cy="${yy}" r="4.5" fill="${ORANGE}" opacity="${on * Math.sin(p * Math.PI)}"/>`
        + `<circle cx="${540 - x}" cy="${yy}" r="4.5" fill="${ORANGE}" opacity="${on * Math.sin(p * Math.PI)}"/>`; });
    return s + `<line x1="322" y1="140" x2="372" y2="140" stroke="#fff" stroke-width="2" opacity="${sh}"/>` + txt(378, 146, "鏡のような面", sh, INK, 19, "start")
      + txt(378, 170, "熱をはね返す", b, ORANGE, 17, "start"); },
  lid(lt, c) { const g = seg(lt, c.lid - .2, .5), lk = seg(lt, c.leak - .3, .5), pulse = .55 + .45 * Math.sin(lt * 5);
    let s = glow(194, 18, 152, 74, g * .30 * pulse + g * .12, ORANGE, 16) + section({ gap: "#123e44", gapO: .8, lid: mix("#4b5c68", "#a5683a", g) });
    [232, 270, 308].forEach((x, i) => { const p = ((lt * .5 + i * .31) % 1);
      s += arrow(x, 20 - p * 10, x, -4 - p * 26, lk * Math.sin(p * Math.PI)); });
    return s + `<line x1="338" y1="46" x2="378" y2="46" stroke="${ORANGE}" stroke-width="2" opacity="${g}"/>` + txt(384, 52, "フタのまわり", g, ORANGE, 20, "start")
      + txt(384, 76, "少しずつ逃げる", lk, INK, 16, "start"); },
  cold(lt, c) { const h = seg(lt, c.heat - .3, .4), st = seg(lt, c.block - .1, .3), flash = Math.max(0, 1 - Math.abs(lt - c.block - .15) / .45);
    let s = section({ liq: ICE, gap: MINT, gapO: .12 + flash * .4 });
    s += `<rect x="238" y="158" width="26" height="26" rx="5" fill="#bfe0f5" opacity=".8" transform="rotate(${8 + Math.sin(lt) * 4} 251 171)"/>
          <rect x="276" y="168" width="24" height="24" rx="5" fill="#bfe0f5" opacity=".7" transform="rotate(${-12 + Math.cos(lt) * 4} 288 180)"/>`;
    YS.forEach((y, i) => { const p = ((lt * .7 + i * .21) % 1), e = ease(p);
      s += arrow(408 - e * 4, y, 408 - e * 56, y, h * Math.sin(p * Math.PI)) + arrow(132 + e * 4, y, 132 + e * 56, y, h * Math.sin(p * Math.PI))
        + `<line x1="345" y1="${y - 9}" x2="345" y2="${y + 9}" stroke="${ORANGE}" stroke-width="4" stroke-linecap="round" opacity="${st}"/>`
        + `<line x1="195" y1="${y - 9}" x2="195" y2="${y + 9}" stroke="${ORANGE}" stroke-width="4" stroke-linecap="round" opacity="${st}"/>`; });
    return s + txt(430, 150, "外の熱", h, ORANGE, 19) + txt(270, 444, "中は冷たいまま", st, "#8fc6ee", 20); },
  end(lt, c) { const k = seg(lt, c.path - .1, .5);
    return outside() + txt(118, 226, "温かいまま", k, ORANGE, 22) + txt(422, 226, "冷たいまま", k, "#8fc6ee", 22); },
};

window.TOTAL = D.total;
window.renderAt = function (t) {
  let i = D.timing.findIndex(s => t < s.start + s.dur); if (i < 0) i = D.timing.length - 1;
  const T = D.timing[i], S = D.scenes[i], lt = t - T.start;
  const fin = cl(lt / .35), fout = i === D.timing.length - 1 ? 1 : cl((T.dur - lt) / .25), o = Math.min(fin, fout);
  $("head").textContent = S.head; $("head").style.opacity = o; $("head").style.transform = `translateY(${(1 - fin) * 14}px)`;
  $("cap").textContent = S.caption; $("cap").style.opacity = cl((lt - .15) / .35) * fout;
  $("art").innerHTML = ART[S.id](lt, T.cues, T.dur); $("art").style.opacity = o;
  document.querySelector("#bar b").style.width = (t / D.total * 100) + "%";
};
renderAt(0);
</script></body></html>
