<!doctype html><html lang="ja"><head><meta charset="utf-8">
<style>
@font-face{font-family:N;font-weight:500;src:url(../fonts/noto-sans-jp-japanese-500-normal.woff2)}
@font-face{font-family:N;font-weight:700;src:url(../fonts/noto-sans-jp-japanese-700-normal.woff2)}
@font-face{font-family:N;font-weight:900;src:url(../fonts/noto-sans-jp-japanese-900-normal.woff2)}
@font-face{font-family:NL;font-weight:700;src:url(../fonts/noto-sans-jp-latin-700-normal.woff2)}
@font-face{font-family:NL;font-weight:900;src:url(../fonts/noto-sans-jp-latin-900-normal.woff2)}
:root{--navy:#0d1b24;--navy2:#132a36;--mint:#5fd6c3;--ink:#f3f7f8;--dim:#8fb0b8;--orange:#f39a4a}
*{box-sizing:border-box}
body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:NL,N,sans-serif;color:var(--ink);
 background:var(--navy);background-image:linear-gradient(rgba(95,214,195,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(95,214,195,.09) 1px,transparent 1px);background-size:40px 40px}
#margin{position:absolute;left:96px;top:0;bottom:0;width:3px;background:rgba(243,154,74,.55)}
#holes{position:absolute;left:30px;top:0;bottom:0;width:36px;background:radial-gradient(circle at 18px 18px,#071118 13px,transparent 14px) 0 0/36px 120px}
#top{position:absolute;top:150px;left:140px;right:70px;display:flex;justify-content:space-between;align-items:flex-end}
#log{font-weight:900;font-size:44px;color:var(--mint);border:4px solid var(--mint);border-radius:10px;padding:6px 20px;transform:rotate(-3deg);letter-spacing:2px}
#meta{text-align:right;font-size:26px;color:var(--dim);font-weight:700;line-height:1.5}
#label{position:absolute;top:310px;left:140px;font-size:32px;font-weight:700;color:var(--orange)}
#head{position:absolute;top:370px;left:140px;right:70px;font-weight:900;font-size:74px;line-height:1.35}
#head em{font-style:normal;background:linear-gradient(transparent 62%,rgba(95,214,195,.55) 62%);padding:0 4px}
#panel{position:absolute;top:680px;left:140px;right:70px;height:560px}
.card{position:absolute;inset:0;border:3px dashed rgba(95,214,195,.5);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{position:relative;font-weight:900;color:var(--mint);line-height:1;letter-spacing:-3px}
.big small{font-size:.42em;letter-spacing:0;margin-left:8px;color:var(--ink)}
.big svg{position:absolute;left:-90px;top:-80px;width:calc(100% + 180px);height:calc(100% + 160px);overflow:visible}
.sub{font-weight:900;font-size:46px;margin-top:46px}
.note{position:absolute;left:30px;right:30px;top:40px;background:#e9f7f3;color:var(--navy);border-radius:6px;padding:50px 46px;transform:rotate(-2deg);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.note:before{content:"";position:absolute;top:-22px;left:50%;width:160px;height:44px;margin-left:-80px;background:rgba(95,214,195,.75);transform:rotate(2deg)}
.note .en{font-family:"Liberation Serif",serif;font-style:italic;font-size:54px;line-height:1.3}
.note .jp{font-weight:900;font-size:46px;margin-top:30px;color:#0d4f47}
.chk{list-style:none;margin:0;padding:0}
.chk li{font-weight:900;font-size:60px;margin:34px 0;display:flex;align-items:center}
.chk li i{width:70px;height:70px;border:5px solid var(--mint);border-radius:10px;margin-right:30px;position:relative;flex:none}
.chk li i b{position:absolute;left:12px;top:-14px;font-style:normal;font-size:70px;color:var(--mint);line-height:1}
.blank{font-weight:900;font-size:64px;display:flex;align-items:flex-end;gap:16px}
.blank span{display:inline-block;width:330px;border-bottom:6px solid var(--mint);height:90px;position:relative}
.blank span:after{content:"";position:absolute;left:12px;bottom:10px;width:6px;height:70px;background:var(--mint)}
#cap{position:absolute;top:1330px;left:140px;right:70px;border-left:8px solid var(--mint);padding:10px 0 10px 28px}
#cap .k{font-size:26px;color:var(--mint);font-weight:700}
#cap .j{font-weight:900;font-size:50px;line-height:1.4}
#cap .e{font-family:"Liberation Serif",serif;font-style:italic;font-size:30px;color:var(--dim);margin-top:4px}
#note{position:absolute;top:1560px;left:140px;right:70px;font-size:22px;color:var(--dim);font-weight:500;line-height:1.6}
#bar{position:absolute;top:1670px;left:140px;right:70px;height:6px;background:rgba(95,214,195,.15)}#bar b{display:block;height:100%;background:var(--mint)}
</style></head><body>
<div id="holes"></div><div id="margin"></div>
<div id="top"><div id="log"></div><div id="meta">TRY LOG 実験ノート<br>対象：Dan Koe（本人の記事より）</div></div>
<div id="label"></div><div id="head"></div><div id="panel"></div>
<div id="cap"><div class="k">MEMO</div><div class="j"></div><div class="e"></div></div><div id="note"></div><div id="bar"><b></b></div>
<script src="build/data.js"></script>
<script>
const D=window.DATA,$=s=>document.querySelector(s),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)};
$("#log").textContent=D.tag; $("#note").textContent=D.note; window.TOTAL=D.total;
const circle=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path id="ring" d="M8 52 C8 18 92 12 94 48 C96 86 12 92 10 56 C9 40 30 26 52 24" fill="none" stroke="#f39a4a" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-width:7px"/></svg>`;
function panelHTML(p){
 if(p.type==="num"){const n=p.big.replace(/<.*/,"").length;return `<div class="card"><div class="big" style="font-size:${n>3?190:260}px">${circle}${p.big}</div><div class="sub">${p.sub}</div></div>`}
 if(p.type==="quote")return `<div class="note"><div class="en">${p.en}</div><div class="jp">${p.jp}</div></div>`;
 if(p.type==="list")return `<div class="card"><ul class="chk">${p.items.map(x=>`<li><i><b>✓</b></i>${x}</li>`).join("")}</ul></div>`;
 return `<div class="card"><div class="blank">今日の記録：<span></span>歩</div><div class="sub">${p.sub}</div></div>`}
let last=-1;
window.renderAt=function(t){let i=D.timing.findIndex(s=>t<s.start+s.dur);if(i<0)i=D.timing.length-1;
 const T=D.timing[i],S=D.scenes[i],lt=t-T.start,c1=(T.cues||{}).c1||.4;
 if(i!==last){$("#head").innerHTML=S.head.replace("/","<br>").replace(/\[(.+?)\]/g,"<em>$1</em>");$("#panel").innerHTML=panelHTML(S.panel);
  $("#label").textContent=S.label;$("#cap .j").textContent=S.caption;$("#cap .e").textContent=S.en||"";last=i}
 const fin=ease(lt/.3),fout=i===D.timing.length-1?1:cl((T.dur-lt)/.2),o=fin*fout;
 $("#head").style.opacity=o;$("#head").style.transform=`translateX(${(1-fin)*-40}px)`;$("#label").style.opacity=o;
 const k=ease((lt-c1+.3)/.35);$("#panel").style.opacity=Math.max(.15,k)*fout;$("#panel").style.transform=`translateY(${(1-k)*30}px)`;
 const r=$("#ring");if(r){const L=r.getTotalLength();r.style.strokeDasharray=L;r.style.strokeDashoffset=L*(1-ease((lt-c1)/.6))}
 [...document.querySelectorAll(".chk li")].forEach((li,n)=>{const a=cl((lt-c1+.2-n*.7)/.3);li.style.opacity=.25+.75*a;li.querySelector("b").style.opacity=a});
 const cur=document.querySelector(".blank span");if(cur)cur.style.setProperty("--x",1),cur.style.opacity=1,cur.classList.toggle("off",Math.floor(lt*2)%2===0);
 $("#cap").style.opacity=cl((lt-.1)/.3)*fout;$("#bar b").style.width=(t/D.total*100)+"%"};
renderAt(0);
</script></body></html>
