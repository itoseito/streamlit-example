<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="../common_wide.css">
<style>#stage{padding:40px 80px}h1{font-weight:900;font-size:34px;color:var(--mint)}p.s{color:var(--dim);font-size:20px;margin-top:6px}
.row{display:flex;gap:24px;margin-top:22px}.card{width:276px;background:var(--panel);border-radius:18px;overflow:hidden}
.card img{width:276px;height:250px;object-fit:cover;object-position:50% 18%;display:block}.card b{display:block;padding:12px 14px 2px;font-size:22px}
.card span{display:block;padding:0 14px 14px;color:var(--dim);font-size:16px}.lab{font-weight:900;font-size:24px;margin-top:26px}
.m .lab,.m b{color:var(--orange)}.n .lab,.n b{color:var(--mint)}.grp{display:inline-block;vertical-align:top;margin-right:40px}.grp .row{gap:16px}.grp .card{width:276px}
#ai{position:absolute;right:80px;top:48px;border:3px solid #f6e9b8;color:#f6e9b8;border-radius:999px;padding:8px 22px;font-weight:700;font-size:22px}</style></head><body>
<div id="stage"><h1>TRY LOG 登場人物（架空）</h1><p class="s">名前はすべて仮。動画に出すときは「AIで作った架空の人物」と必ず表示する。</p><div id="ai">AI生成・架空の人物</div>
<div class="grp m"><div class="lab">先を行く人（3人）</div><div class="row">
<div class="card"><img src="m1.jpg"><b>レオ（仮）</b><span>カフェで働く／考え方を見せる役</span></div>
<div class="card"><img src="m2.jpg"><b>マルコ（仮）</b><span>書斎・机／仕組みを図で示す役</span></div>
<div class="card"><img src="m3.jpg"><b>ダン（仮）</b><span>ジム／体と習慣の役</span></div></div></div>
<div class="n"><div class="lab">これからの人（3人）</div></div><div class="row n" style="margin-top:12px">
<div class="card"><img src="n1.jpg"><b>ハルト（仮）</b><span>20代・営業／やる気動画を見て燃えるタイプ</span></div>
<div class="card"><img src="n2.jpg"><b>ソウタ（仮）</b><span>30代・事務／慎重派。副業の一歩目</span></div>
<div class="card"><img src="n3.jpg"><b>リク（仮）</b><span>20代後半／筋トレは続くが、勉強が続かない</span></div></div>
</div></body></html>
