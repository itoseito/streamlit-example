<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="../common_wide.css">
<style>#t{position:absolute;left:80px;top:40px;font-weight:900;font-size:34px;color:var(--mint)}#s{position:absolute;left:80px;top:90px;font-size:22px;color:var(--dim)}</style></head><body>
<div id="stage"><div id="t">TRY LOG キャラクター：会社員（架空）</div><div id="s">三面図と表情。SVGで描いているので、動かせる・着替えられる・追加費用なし</div>
<svg id="art" style="position:absolute;left:0;top:130px;width:1920px;height:950px" viewBox="0 0 1920 950"></svg></div>
<script>const MINT="#5fd6c3",ORANGE="#f39a4a",INK="#f3f7f8",DIM="#8ea3ad";</script><script src="chara.js"></script>
<script>
const T=(x,y,s,c=INK,z=26)=>`<text x="${x}" y="${y}" fill="${c}" font-size="${z}" text-anchor="middle" font-family="NL,N,sans-serif" font-weight="700">${s}</text>`;
let s=`<line x1="80" y1="560" x2="1100" y2="560" stroke="#22363f" stroke-width="3"/>`;
[["front","正面",260],["side","横",590],["back","後ろ",920]].forEach(([v,l,x])=>{s+=chara(v,x,540,2)+T(x,610,l,MINT,30);});
s+=`<line x1="1180" y1="60" x2="1180" y2="880" stroke="#22363f" stroke-width="3"/>`+T(1530,70,"表情",DIM,24);
[["normal","ふつう"],["tired","疲れた"],["focus","集中"],["smile","ほっと"]].forEach(([f,l],i)=>{const x=1330+(i%2)*400,y=i<2?380:800;
 s+=`<clipPath id="c${i}"><rect x="${x-130}" y="${y-300}" width="260" height="250" rx="20"/></clipPath><rect x="${x-130}" y="${y-300}" width="260" height="250" rx="20" fill="#16262f"/>`
  +`<g clip-path="url(#c${i})">${chara("front",x,y+160,1.8,{face:f})}</g>`+T(x,y-10,l,MINT,26);});
s+=T(260,700,"上着あり",DIM,22)+chara("front",260,920,.85,{jacket:true})+T(590,700,"腕を前に（横）",DIM,22)+chara("side",590,920,.85,{arm:-60})+T(920,700,"スマホ時は小物を足す",DIM,22)+chara("side",920,920,.85,{arm:-80,face:"tired"});
document.getElementById("art").innerHTML=s;
</script></body></html>
